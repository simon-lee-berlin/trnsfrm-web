<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRNSFRM eG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Syne+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --white: #f5f4f0;
    }

    html, body {
      height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: 'Syne', sans-serif;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 2rem 2.5rem 1.5rem;
      display: flex;
      align-items: center;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards;
    }

    .site-name {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1rem 2.5rem 2rem;
    }

    .video-container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.2s forwards;
    }

    .video-ratio {
      padding: 56.25% 0 0 0;
      position: relative;
      border-radius: 4px;
      overflow: hidden;
    }

    .video-ratio iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .video-caption {
      margin-top: 1rem;
      font-family: 'Syne Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(245,244,240,0.35);
      text-align: right;
    }

    footer {
      padding: 1.5rem 2.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.4s forwards;
    }

    .footer-left {
      font-family: 'Syne Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(245,244,240,0.35);
      line-height: 1.8;
    }

    .footer-right a {
      font-family: 'Syne Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      color: var(--white);
      text-decoration: none;
      border-bottom: 1px solid rgba(245,244,240,0.3);
      padding-bottom: 1px;
      transition: border-color 0.2s;
    }

    .footer-right a:hover {
      border-color: var(--white);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      header { padding: 1.5rem 1.2rem 1rem; }
      main   { padding: 1rem 1.2rem 1.5rem; }
      footer { padding: 1rem 1.2rem 1.5rem; flex-direction: column; gap: 1rem; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <header>
    <span class="site-name">TRNSFRM eG</span>
  </header>

  <main>
    <div class="video-container">
      <div class="video-ratio">
        <iframe
          src="https://player.vimeo.com/video/1176267516?badge=0&autopause=0&player_id=0&app_id=58479"
          allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          title="Haus aus Müll - CRCLR House">
        </iframe>
      </div>
      <p class="video-caption">Haus aus Müll - CRCLR House</p>
    </div>
  </main>

  <footer>
    <div class="footer-left">
      TRNSFRM eG<br>
      Transformation bauen
    </div>
    <div class="footer-right">
      <a href="mailto:info@trnsfrm.org">info&#64;trnsfrm.org</a>
    </div>
  </footer>

  <script src="https://player.vimeo.com/api/player.js"></script>
</body>
</html>
